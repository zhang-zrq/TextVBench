<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TextVBench · Ref2V Review</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="identity"><span class="brand">TextVBench</span><span class="separator"></span><span id="product-label">Ref2V Review</span></div>
      <div class="header-actions"><span class="header-label">REFERENCE-TO-VIDEO EVIDENCE</span><div class="language-switch" id="language-switch"><button data-language="zh" class="active" type="button">中文</button><button data-language="en" type="button">EN</button></div></div>
    </div>
  </header>
  <main id="app" class="container" aria-live="polite"></main>
  <dialog id="image-viewer" class="image-viewer"><div class="viewer-shell"><header class="viewer-header"><strong id="viewer-title"></strong><div class="viewer-controls"><button id="viewer-out" type="button">−</button><span id="viewer-scale">100%</span><button id="viewer-in" type="button">+</button><button id="viewer-reset" type="button">↺</button><button id="viewer-close" type="button">×</button></div></header><div id="viewer-viewport" class="viewer-viewport"><img id="viewer-image" alt=""></div></div></dialog>
  <script src="app.js?v=6" defer></script>
</body>
</html>
