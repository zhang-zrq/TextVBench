<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TextVBench · Evaluator Review</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="identity"><span class="brand">TextVBench</span><span class="separator"></span><span id="product-label">Evaluator Review</span></div>
      <div class="header-actions">
        <span class="header-label" id="header-label">EVALUATION EVIDENCE</span>
        <div class="language-switch" id="language-switch" role="group" aria-label="Interface language">
          <button type="button" data-ui-language="zh" aria-pressed="true">中文</button>
          <button type="button" data-ui-language="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>
  <main id="app" class="container" aria-live="polite"></main>
  <dialog id="image-viewer" class="image-viewer" aria-labelledby="viewer-title">
    <div class="viewer-shell">
      <header class="viewer-header">
        <strong id="viewer-title"></strong>
        <div class="viewer-controls">
          <button id="viewer-zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
          <span id="viewer-scale">100%</span>
          <button id="viewer-zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
          <button id="viewer-reset" type="button" aria-label="Reset view" title="Reset view">↺</button>
          <button id="viewer-close" type="button" aria-label="Close image viewer" title="Close image viewer">×</button>
        </div>
      </header>
      <div class="viewer-viewport" id="viewer-viewport"><img id="viewer-image" alt="" draggable="false"></div>
      <div class="viewer-hint" id="viewer-hint"></div>
    </div>
  </dialog>
  <script src="app.js?v=6" defer></script>
</body>
</html>
